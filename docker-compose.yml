services:
  go-service-1:
    image: go-service
    build: .
    command: ["./service", "8080"]
    ports:
    - "8080:8080"

  go-service-2:
    image: go-service
    build: .
    command: ["./service", "8081"]
    ports:
    - "8081:8081"

  go-service-3:
    image: go-service
    build: .
    command: ["./service", "8082"]
    ports:
    - "8082:8082"